<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>chudgaye.guru</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      cursor: default;
    }

    body {
      display: grid;
      place-items: center;
    }

    img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      image-rendering: auto;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <img src="monkey.jpg" alt="monke" />

  <script>
    // Prevent right click
    document.addEventListener("contextmenu", (e) => e.preventDefault());

    // Prevent drag
    document.addEventListener("dragstart", (e) => e.preventDefault());
  </script>
</body>
</html>
