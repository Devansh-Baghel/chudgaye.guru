<html lang="en">

  <title>chudgaye.guru</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
      position: relative;
    }

    img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      pointer-events: none;
    }

    .credit {
      position: fixed;
      right: 16px;
      bottom: 16px;

      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      font-size: 12px;
      font-weight: 500;

      color: rgba(255, 255, 255, 0.22);
      text-decoration: none;

      transition: color 0.2s ease;
    }

    .credit:hover {
      color: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>

<body>
  <img src="monkey.jpg" alt="monke" />
